services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: echoes_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echoes_test"]
      interval: 2s
      timeout: 2s
      retries: 30
