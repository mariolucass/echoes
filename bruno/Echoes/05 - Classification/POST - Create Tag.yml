info:
  name: POST - Create Tag
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/classification/tags"
  body:
    type: json
    data: |-
      {
        "name": "Carreira"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: tagId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
