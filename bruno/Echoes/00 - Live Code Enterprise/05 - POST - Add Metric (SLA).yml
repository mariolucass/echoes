info:
  name: 05 - POST - Add Metric (SLA)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/decisions/{{decisionId}}/metrics"
  body:
    type: json
    data: |-
      {
        "name": "Tempo de Geração do Relatório DRE",
        "unit": "s"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: metricId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
