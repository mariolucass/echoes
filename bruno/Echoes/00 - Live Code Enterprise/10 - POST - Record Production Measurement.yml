info:
  name: 10 - POST - Record Production Measurement
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/tracking/metrics/{{metricId}}/measurements"
  body:
    type: json
    data: |-
      {
        "value": "9.0000",
        "notes": "Telemetria real do Render: reduziu de 12s para 9s com as consultas otimizadas"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: measurementId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
