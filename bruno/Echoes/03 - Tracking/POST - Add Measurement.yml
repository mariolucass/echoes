info:
  name: POST - Add Measurement
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/tracking/metrics/{{metricId}}/measurements"
  body:
    type: json
    data: |-
      {
        "value": "12000.00",
        "notes": "Medição independente da revisão"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: measurementId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
