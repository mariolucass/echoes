info:
  name: PATCH - Complete Checkpoint
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/tracking/checkpoints/{{checkpointId}}"
  body:
    type: json
    data: |-
      {
        "completedAt": "2026-10-15T15:30:00.000Z",
        "score": 8,
        "notes": "Progresso satisfatório"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
