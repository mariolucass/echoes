info:
  name: POST - Create Checkpoint
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/tracking/checkpoints"
  body:
    type: json
    data: |-
      {
        "decisionId": "{{decisionId}}",
        "scheduledFor": "2026-10-15T15:00:00.000Z",
        "notes": "Revisar progresso da decisão"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.id
        method: jsonq
      variable:
        name: checkpointId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
