info:
  name: POST - Review Decision
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/decisions/{{decisionId}}/reviews"
  body:
    type: json
    data: |-
      {
        "outcome": {
          "description": "Após o primeiro mês, o salário ficou acima da meta",
          "impact": 8
        },
        "measurements": [
          {
            "metricId": "{{metricId}}",
            "value": "12500.00",
            "notes": "Valor recebido no primeiro mês"
          }
        ],
        "assessments": [
          {
            "expectationId": "{{expectationId}}",
            "result": "MET",
            "notes": "A remuneração atingiu a meta definida"
          }
        ],
        "reflection": {
          "content": "A mudança correspondeu ao que eu esperava",
          "satisfactionScore": 9,
          "regretScore": 1
        },
        "complete": true
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.outcomeId
        method: jsonq
      variable:
        name: outcomeId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.reflectionId
        method: jsonq
      variable:
        name: reflectionId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
